name: passport-auth

services:
  secrets-init:
    image: python:3.13-slim
    command: ["python", "/usr/local/bin/generate-runtime-secrets.py", "/run/passport-auth-secrets"]
    volumes:
      - runtime-secrets:/run/passport-auth-secrets
    configs:
      - source: runtime_secret_generator
        target: /usr/local/bin/generate-runtime-secrets.py
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - WEB_STATIC_DIR=/app/static
      - DASHBOARD_ASSET_DIR=${DASHBOARD_ASSET_DIR:-/app/data/dashboard-assets}
      - DASHBOARD_JWT_TTL_SECONDS=${DASHBOARD_JWT_TTL_SECONDS:-28800}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SERVICE_BASE64_64_APP_ENCRYPTION_KEY=${SERVICE_BASE64_64_APP_ENCRYPTION_KEY:-}
      - SERVICE_BASE64_64_DASHBOARD_JWT_SECRET=${SERVICE_BASE64_64_DASHBOARD_JWT_SECRET:-}
      - SERVICE_BASE64_64_PUBLIC_JWT_SECRET=${SERVICE_BASE64_64_PUBLIC_JWT_SECRET:-}
      - SERVICE_PASSWORD_64_POSTGRES=${SERVICE_PASSWORD_64_POSTGRES:-}
      - SERVICE_PASSWORD_64_CLICKHOUSE=${SERVICE_PASSWORD_64_CLICKHOUSE:-}
    expose:
      - "8000"
    volumes:
      - dashboard-assets:/app/data/dashboard-assets
      - runtime-secrets:/run/passport-auth-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: passport_auth
      POSTGRES_USER: passport
      POSTGRES_PASSWORD_FILE: /run/passport-auth-secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - runtime-secrets:/run/passport-auth-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: passport_auth
      SERVICE_PASSWORD_64_CLICKHOUSE: ${SERVICE_PASSWORD_64_CLICKHOUSE:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export SERVICE_PASSWORD_64_CLICKHOUSE="`cat /run/passport-auth-secrets/clickhouse_password`"
        exec /entrypoint.sh "$$@"
      - clickhouse-entrypoint
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - runtime-secrets:/run/passport-auth-secrets:ro
    configs:
      - source: clickhouse_passport_user
        target: /etc/clickhouse-server/users.d/passport-user.xml
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user passport --password \"`cat /run/passport-auth-secrets/clickhouse_password`\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  runtime-secrets:
    name: passport-auth_runtime-secrets
  postgres-data:
    name: passport-auth_postgres-data
  redis-data:
    name: passport-auth_redis-data
  clickhouse-data:
    name: passport-auth_clickhouse-data
  dashboard-assets:
    name: passport-auth_dashboard-assets

configs:
  runtime_secret_generator:
    file: ./scripts/generate-runtime-secrets.py
  clickhouse_passport_user:
    file: ./deploy/clickhouse/users.d/passport-user.xml
