name: passport-auth

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - WEB_STATIC_DIR=/app/static
      - DASHBOARD_ASSET_DIR=${DASHBOARD_ASSET_DIR:-/app/data/dashboard-assets}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?}
      - DASHBOARD_JWT_TTL_SECONDS=${DASHBOARD_JWT_TTL_SECONDS:-31536000}
      - DATABASE_URL=${DATABASE_URL:?}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:?}
    expose:
      - "8000"
    volumes:
      - dashboard-assets:/app/data/dashboard-assets
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    profiles: ["local"]
    environment:
      POSTGRES_DB: passport_auth
      POSTGRES_USER: passport
      POSTGRES_PASSWORD: passport
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    profiles: ["local"]
    environment:
      CLICKHOUSE_DB: passport_auth
      CLICKHOUSE_USER: passport
      CLICKHOUSE_PASSWORD: passport
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  dashboard-assets:
