name: passport-auth

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - WEB_STATIC_DIR=/app/static
      - DASHBOARD_ASSET_DIR=${DASHBOARD_ASSET_DIR:-/app/data/dashboard-assets}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-${SERVICE_BASE64_64_APP_ENCRYPTION_KEY:-}}
      - DASHBOARD_JWT_SECRET=${DASHBOARD_JWT_SECRET:-${SERVICE_BASE64_64_DASHBOARD_JWT_SECRET:-}}
      - PUBLIC_JWT_SECRET=${PUBLIC_JWT_SECRET:-${SERVICE_BASE64_64_PUBLIC_JWT_SECRET:-}}
      - DASHBOARD_JWT_TTL_SECONDS=${DASHBOARD_JWT_TTL_SECONDS:-28800}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-passport}:${POSTGRES_PASSWORD:-${SERVICE_PASSWORD_64_POSTGRES:-}}@postgres:5432/${POSTGRES_DB:-passport_auth}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://${CLICKHOUSE_USER:-passport}:${CLICKHOUSE_PASSWORD:-${SERVICE_PASSWORD_64_CLICKHOUSE:-}}@clickhouse:8123/${CLICKHOUSE_DB:-passport_auth}}
    expose:
      - "8000"
    volumes:
      - dashboard-assets:/app/data/dashboard-assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passport_auth}
      POSTGRES_USER: ${POSTGRES_USER:-passport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_PASSWORD_64_POSTGRES:-}}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-passport_auth}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-passport}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-${SERVICE_PASSWORD_64_CLICKHOUSE:-}}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
    name: ${PASSPORT_AUTH_VOLUME_PREFIX:-passport-auth}_postgres-data
  redis-data:
    name: ${PASSPORT_AUTH_VOLUME_PREFIX:-passport-auth}_redis-data
  clickhouse-data:
    name: ${PASSPORT_AUTH_VOLUME_PREFIX:-passport-auth}_clickhouse-data
  dashboard-assets:
    name: ${PASSPORT_AUTH_VOLUME_PREFIX:-passport-auth}_dashboard-assets
