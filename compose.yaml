name: passport-auth

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      WEB_STATIC_DIR: ${WEB_STATIC_DIR:-/app/static}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-replace-with-a-32-byte-minimum-secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://passport:passport@postgres:5432/passport_auth}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passport_auth}
      POSTGRES_USER: ${POSTGRES_USER:-passport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passport}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-passport_auth}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-passport}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-passport}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
