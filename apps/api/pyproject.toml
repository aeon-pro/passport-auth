[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "passport-auth-api"
version = "0.1.0"
description = "FastAPI backend for Passport Auth."
readme = "../../README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/passport_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
